spring:
  application:
    name: smart_home_back

  datasource:
    url: jdbc:h2:mem:smart_home
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080