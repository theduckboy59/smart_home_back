
spring:
  application:
    name: smart_home_back

  datasource:
    url: "jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/smart_home"
    username: postgres
    password: "manuel59"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  initial-user-name: ${APP_INITIAL_USER:}
  initial-user-password: ${APP_INITIAL_PASSWORD:}

  mqtt:
    broker-url: tcp://127.0.0.1:1883
    client-id: smart-home-backend
    command-topic: smart_home/esp32/command
    status-topic: smart_home/esp32/status
